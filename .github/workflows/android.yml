name: Build Android 4.4 music player

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 35 SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compile APK
        run: gradle --no-daemon --stacktrace -p NaganMusic44 :app:assembleDebug

      - name: Package source ZIP
        run: |
          cd NaganMusic44
          zip -r ../NaganMusic44-source.zip . -x 'app/build/*' -x '.gradle/*'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nagan-android-2.1.4
          path: |
            NaganMusic44/app/build/outputs/apk/debug/app-debug.apk
            NaganMusic44-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/android44-rebuild' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.4
          target_commitish: android44-rebuild
          name: נגן 2.1.4
          body: |
            גרסה 2.1.4 לנגן Android 4.4.
            שופרה הרצה קדימה ואחורה בלחיצה ממושכת.
            תמונות עטיפה נשלפות גם מתוך המטא־נתונים המוטמעים ובתיקיות האלבומים, באיכות גבוהה יותר ועם פינות מעוגלות.
            רשימות שירים, אמנים ואלבומים מוכנות מראש ברקע למעבר מהיר.
            מתקנת קריסה אפשרית בפתיחת מסך הנגן באמצעות טעינה חסכונית של תמונות אלבום.
            שורת החיפוש נשארת קבועה מעל רשימת השירים ואינה נגללת עם התוצאות.
            ספריית המוזיקה נשמרת במטמון כדי למנוע סריקה מלאה בכל פתיחת האפליקציה; סריקה חוזרת מתבצעת בעת שינוי בספרייה או בלחיצה על רענון.
            כוללת גם יצירה וייבוא של פלייליסטים, פעולות בלחיצה ארוכה ועיצוב משופר למסך מתנגן כעת.
          files: |
            NaganMusic44/app/build/outputs/apk/debug/app-debug.apk
            NaganMusic44-source.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
