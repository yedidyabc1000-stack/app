name: Build Android music player

on:
  push:
    branches: [ main, android44-rebuild ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 35 SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses < /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compile the app matching this branch
        run: |
          mkdir -p dist
          if [ -f NaganMusic44/settings.gradle ]; then
            gradle --no-daemon --stacktrace -p NaganMusic44 :app:assembleDebug
            cp NaganMusic44/app/build/outputs/apk/debug/app-debug.apk dist/NaganMusic44-Android44.apk
            cd NaganMusic44
            zip -r ../dist/NaganMusic44-source.zip . -x 'app/build/*' -x '.gradle/*'
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-music-player
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Android 4.4 release
        if: github.ref == 'refs/heads/android44-rebuild' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          target_commitish: android44-rebuild
          name: נגן 2.1.0
          body: |
            גרסה 2.1.0 לנגן Android 4.4.
            כוללת יצירה וייבוא של פלייליסטים, פעולות בלחיצה ארוכה, סריקה אוטומטית, סינון קבצים מוסתרים ועיצוב משופר למסך מתנגן כעת.
          files: |
            dist/NaganMusic44-Android44.apk
            dist/NaganMusic44-source.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
