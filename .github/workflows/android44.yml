name: Build NaganMusic44
on:
  push:
    branches:
      - android44-rebuild
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload
          cat \
            .build/parts/part{00..15}.b64 \
            .build/repack2/16-00.b64 .build/repack2/16-01.b64 .build/repack2/16-02.b64 .build/repack2/16-03.b64 .build/repack2/16-04.b64 .build/repack2/16-05.b64 \
            .build/repack3/17-00a.b64 .build/repack3/17-00b.b64 \
            .build/repack2/17-01.b64 .build/repack2/17-02.b64 .build/repack2/17-03.b64 \
            .build/repack3/17-04a.b64 .build/repack3/17-04b.b64 \
            .build/repack2/17-05.b64 \
            .build/repack3/18-00a.b64 .build/repack3/18-00b.b64 \
            .build/repack2/18-01.b64 .build/repack2/18-02.b64 .build/repack2/18-03.b64 \
            .build/repack3/18-04a.b64 .build/repack3/18-04b.b64 \
            .build/repack2/18-05.b64 \
            .build/parts/part19.b64 | base64 --decode > payload/NaganMusic44.zip
          unzip -t payload/NaganMusic44.zip
          unzip -q payload/NaganMusic44.zip -d payload/source

      - name: Build APK
        run: |
          cd payload/source/NaganMusic44
          gradle --no-daemon --stacktrace assembleDebug

      - name: Publish source and APK to repository
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}"
          mkdir -p releases
          cp payload/source/NaganMusic44/app/build/outputs/apk/debug/app-debug.apk releases/NaganMusic44-Android44.apk
          cp payload/NaganMusic44.zip releases/NaganMusic44-source.zip
          cp -a payload/source/NaganMusic44 ./NaganMusic44
          rm -rf NaganMusic44/app/build
          rm -rf .build
          rm -f ANDROID44_BUILD_TRIGGER.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Android 4.4 source and APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nagan-android44-debug-apk
          path: payload/source/NaganMusic44/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
