name: Build NaganMusic44
on:
  push:
    branches:
      - android44-rebuild

permissions:
  contents: write

# Keep only the newest branch build active; releases and asset commits must not race.
concurrency:
  group: nagan-android44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/NaganMusic44-source.zip
          zip -qr /tmp/NaganMusic44-source.zip NaganMusic44 -x 'NaganMusic44/**/build/*' 'NaganMusic44/**/.gradle/*'

      - name: Build APK
        run: |
          cd NaganMusic44
          gradle --no-daemon --stacktrace assembleDebug

      - name: Publish source and APK to repository
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "${GITHUB_REF_NAME}"
          mkdir -p releases
          cp NaganMusic44/app/build/outputs/apk/debug/app-debug.apk releases/NaganMusic44-Android44.apk
          cp /tmp/NaganMusic44-source.zip releases/NaganMusic44-source.zip
          git add releases/NaganMusic44-Android44.apk releases/NaganMusic44-source.zip
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish Android 4.4 source and APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.2
          target_commitish: ${{ github.ref_name }}
          name: נגן Android 4.4 – v2.5.2
          body: |
            גרסה 2.5.1 של נגן המוזיקה, תואמת Android 4.4 (API 19) ומעלה.
            השמעה נרשמת רק לאחר 60 שניות של האזנה בפועל לאותו שיר; זמן השהיה אינו נצבר. נתוני ההשמעה ההיסטוריים נשמרים, כי הגרסאות הקודמות לא שמרו את משך ההאזנה ולכן אי אפשר לסווג אותם מחדש.
            קטגוריית "מיקסים" כוללת שישה מצבי רוח ואת "סופר מיקס", שמותאם להיסטוריית ההאזנה, לאמנים, לסגנונות ולמאפייני מצב הרוח של שירים שהמשתמש מרבה להשמיע. המיקס נפתח רק לאחר לפחות 10 שירים שונים ו-30 השמעות.
            סריקת הספרייה קוראת תגיות BPM, סולם וסגנון מוזיקלי מקובצי MP3 (ID3), FLAC ו-Ogg/Opus, ומנסה לקרוא גם תגיות סגנון דרך Android MediaMetadataRetriever בפורמטים נתמכים.
            כל כניסה למיקס מצב רוח בוחרת מחדש באקראי עד 35 שירים; סופר מיקס משתמש בדירוג משוקלל לפי ההעדפות שנלמדו מההשמעות.
            מקשי הספרות 1 ו-3 (וגם Numpad 1/3) מריצים אחורה או קדימה ב-10 שניות בזמן נגינה.
            במיקסים וברשימות השמעה הנגן טוען מראש את הרצועה הבאה ומבצע Crossfade מדורג של עד 4 שניות. אם הכנת הנגן הבא נכשלת, מתבצע מעבר רגיל.
            סינון קבצים בתיקיות ששמן מתחיל בנקודה הוחמר גם בשאילתת MediaStore וגם בטעינת המטמון, עם מסלול גיבוי לספקי Android ישנים.
            פס ההתקדמות מסנכרן מחדש את המילוי הכחול ואת הסמן בכל כניסה למסך השיר.
            השמעת שירים מנסה קודם כתובת MediaStore, ואם הכנת הנגן נכשלת מנסה פעם אחת את נתיב הקובץ המקומי (או להפך). כך יש מסלול התאוששות גם בספקי מדיה ישנים של Android 4.4.
            סינון הקבצים המוסתרים בודק גם את שם הקובץ שמדווח MediaStore וגם את כל רכיבי הנתיב ותיקיות .nomedia. מפתח המטמון שונה כדי לאלץ סריקה מלאה מחדש בהתקנה של גרסה זו.
            תמונת העטיפה, גודל הכפתורים, מיקום ציר הזמן, סמל הפלייליסטים ושורת המצב נשארו כפי שעודכנו בגרסאות הקודמות.
          files: |
            releases/NaganMusic44-Android44.apk
            releases/NaganMusic44-source.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nagan-android44-2.5.2-debug-apk
          path: releases/NaganMusic44-Android44.apk
          if-no-files-found: error
          retention-days: 14
