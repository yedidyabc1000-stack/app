plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yedidyabc1000.nagan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yedidyabc1000.nagan'
        minSdk 19
        targetSdk 28
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
